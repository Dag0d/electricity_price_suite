refresh_timeline:
  name: Refresh timeline
  description: Refresh today and tomorrow slots from configured sources, or explicitly poll selected providers, and merge by priority.
  target:
    entity:
      domain: sensor
  fields:
    sources:
      required: false
      description: Optional temporary source override list for this call only.
      example: "[{\"id\": \"provider_1_smard\", \"type\": \"smard\", \"priority\": 0, \"market_area\": \"DE-LU\", \"duration_minutes\": 15}]"
      selector:
        object: {}
    source_ids:
      required: false
      description: Optional list of configured provider source ids to refresh or explicitly poll, for example source_1_tibber or source_2_entsoe. Cannot be used together with sources.
      example: "[\"source_1_tibber\", \"source_2_entsoe\"]"
      selector:
        object: {}
    overwrite:
      required: false
      description: If true, delete currently stored rows for today and tomorrow before fetching. Use this for explicit fresh re-fetches after tests or manual injections.
      example: "false"
      selector:
        boolean: {}
    force_fetch:
      required: false
      description: If true, explicitly poll provider APIs even when the normal refresh logic would otherwise skip them.
      example: "false"
      selector:
        boolean: {}

cleanup_timeline_storage:
  name: Cleanup timeline storage
  description: One-time cleanup helper for resetting timeline runtime data while optionally preserving plans and the last consumption snapshot.
  target:
    entity:
      domain: sensor
  fields:
    planner_name:
      required: false
      description: Optional fallback planner name used when preserved plans are missing planner metadata.
      example: "Geräteplanung"
      selector:
        text: {}
    preserve_plans:
      required: false
      description: Keep stored plans and enrich missing planner or device metadata where needed.
      example: "true"
      selector:
        boolean: {}
    clear_sources:
      required: false
      description: Remove stored provider source rows from the timeline store so the new config-flow provider chain becomes authoritative.
      example: "true"
      selector:
        boolean: {}
    clear_slots:
      required: false
      description: Delete persisted timeline price rows, source-health state, and refresh timestamps.
      example: "true"
      selector:
        boolean: {}
    clear_consumption:
      required: false
      description: Delete persisted consumption slot data, monthly consumption rollups, and the last consumption snapshot.
      example: "true"
      selector:
        boolean: {}
    preserve_last_snapshot:
      required: false
      description: Keep the last consumption snapshot while clearing consumption data so the next sample can continue delta tracking after midnight resets.
      example: "true"
      selector:
        boolean: {}
    dry_run:
      required: false
      description: Preview what would be cleaned or preserved without writing changes.
      example: "false"
      selector:
        boolean: {}

schedule_tariff_change:
  name: Schedule tariff change
  description: Schedule a future tariff change either from direct values or by deriving the absolute surcharge from manually entered final prices.
  target:
    entity:
      domain: sensor
  fields:
    mode:
      required: true
      description: Use direct manual values or derive the absolute surcharge from final prices.
      example: "derive_absolute_from_final_prices"
      selector:
        select:
          options:
            - "manual"
            - "derive_absolute_from_final_prices"
            - "delete"
    effective_from:
      required: true
      description: Local effective date in YYYY-MM-DD.
      example: "2026-06-01"
      selector:
        text: {}
    energy_surcharge_percent:
      required: false
      description: Percentage surcharge that should apply from the effective date.
      example: "0"
      selector:
        number:
          min: -100
          max: 1000
          mode: box
    energy_tax_percent:
      required: false
      description: Energy tax or VAT percentage that should apply from the effective date.
      example: "19"
      selector:
        number:
          min: -100
          max: 1000
          mode: box
    energy_surcharge_absolute:
      required: false
      description: Absolute surcharge in EUR/kWh. Required in manual mode.
      example: "0.16583"
      selector:
        number:
          min: -10
          max: 10
          mode: box
    fixed_fee_monthly_amount:
      required: false
      description: Optional monthly fixed fee amount that becomes active on the effective date.
      example: "5.03"
      selector:
        number:
          min: -1000
          max: 1000
          mode: box
    fixed_fee_daily_amount:
      required: false
      description: Optional daily fixed fee amount that becomes active on the effective date.
      example: "0.3997"
      selector:
        number:
          min: -1000
          max: 1000
          mode: box
    fixed_fee_tax_percent:
      required: false
      description: Optional fixed-fee tax percentage.
      example: "19"
      selector:
        number:
          min: -100
          max: 1000
          mode: box
    fixed_fee_values_include_tax:
      required: false
      description: Whether the provided fixed-fee values already include tax.
      example: "true"
      selector:
        boolean: {}
    current_month_fixed_fee_mode:
      required: false
      description: Optional fixed-fee handling mode for the current month.
      example: "prorated"
      selector:
        select:
          options:
            - "prorated"
            - "full"
    billing_slot_minutes:
      required: false
      description: Optional future billing resolution to activate on the effective date.
      example: "60"
      selector:
        number:
          min: 15
          max: 60
          mode: box
    final_price_lines:
      required: false
      description: Multiline list of manual final prices. Each line can be either "HH:MM PRICE" or just "PRICE".
      example: "00:00 0.2100\n00:15 0.3760\n00:30 0.2980"
      selector:
        text:
          multiline: true
    sequence_start:
      required: false
      description: Starting HH:MM used when final_price_lines only contains bare prices.
      example: "13:00"
      selector:
        text: {}

inject_slots:
  name: Inject slots
  description: Inject normalized slots directly into the timeline store.
  target:
    entity:
      domain: sensor
  fields:
    slots:
      required: true
      description: Slot list. Each item needs start_time and price_per_kwh.
      example: "[{\"start_time\": \"2026-03-06T12:00:00+01:00\", \"price_per_kwh\": 0.2987}]"
      selector:
        object: {}
    source_name:
      required: false
      description: Source id stored with injected rows.
      example: "manual_inject"
      selector:
        text: {}
    source_priority:
      required: false
      description: Priority rank for injected rows (lower rank replaces higher rank).
      example: "9999"
      selector:
        number:
          min: 0
          max: 9999
          mode: box
    is_primary:
      required: false
      description: Mark injected rows as primary-source rows.
      example: "false"
      selector:
        boolean: {}
    overwrite:
      required: false
      description: If true, delete stored rows for the same local dates before injecting the new rows.
      example: "false"
      selector:
        boolean: {}

optimize_device:
  name: Optimize device
  description: Compute best start time from stored timeline prices.
  target:
    entity:
      domain: sensor
  fields:
    planner_name:
      required: true
      description: Configured planner device name within this timeline where the plan entity should be created.
      example: "Geräteplanung"
      selector:
        text: {}
    device_name:
      required: true
      description: Logical device label used to build and persist the plan entity.
      example: "Dishwasher"
      selector:
        text: {}
    duration_minutes:
      required: false
      description: Runtime duration in minutes. Provide this, a manual energy profile, or an internal logger profile.
      example: "170"
      selector:
        number:
          min: 1
          max: 2880
          mode: box
    energy_profile:
      required: false
      description: Optional direct profile list of weights or energy segments.
      example: "[0.2, 1.0, 0.8, 0.3]"
      selector:
        object: {}
    profile_slot_minutes:
      required: false
      description: Minutes per profile segment in energy_profile.
      example: "5"
      selector:
        number:
          min: 1
          max: 60
          mode: box
    billing_slot_minutes:
      required: false
      description: Override billing slot length. If omitted, it is detected from timeline data.
      example: "15"
      selector:
        number:
          min: 1
          max: 120
          mode: box
    profile_logger_entity:
      required: false
      description: Meta sensor of an Electricity Price Suite profile logger. Used for direct internal profile loading.
      example: "sensor.dishwasher_neff_profile_logger_meta"
      selector:
        entity:
          domain: sensor
    program_key:
      required: false
      description: Program key to load from the selected profile logger, for example auto_2.
      example: "auto_2"
      selector:
        text: {}
    program_display_name:
      required: false
      description: Optional display name stored with the plan, for example Auto 2 [I,D,S]. This does not change the technical program key.
      example: "Auto 2 [I,D,S]"
      selector:
        text: {}
    align_start_to_billing_slot:
      required: false
      description: If true, candidate starts are restricted to billing slot boundaries.
      example: "false"
      selector:
        boolean: {}
    max_extra_cost_percent:
      required: false
      description: Maximum extra cost in percent that is still acceptable when prefer_earliest is enabled.
      example: "1"
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          mode: box
    prefer_earliest:
      required: false
      description: Pick the earliest candidate within the allowed extra-cost threshold instead of the strict minimum.
      example: "true"
      selector:
        boolean: {}
    start_mode:
      required: false
      description: "Start anchor mode: now or in."
      example: "now"
      selector:
        select:
          options:
            - "now"
            - "in"
    start_in_minutes:
      required: false
      description: Offset used when start_mode is in.
      example: "30"
      selector:
        number:
          min: 0
          max: 10080
          mode: box
    deadline_mode:
      required: false
      description: Relative deadline mode.
      example: "finish_within"
      selector:
        select:
          options:
            - "none"
            - "start_within"
            - "finish_within"
    deadline_minutes:
      required: false
      description: Relative deadline value for the selected deadline_mode.
      example: "360"
      selector:
        number:
          min: 0
          max: 10080
          mode: box
    latest_start:
      required: false
      description: Expert override for absolute latest allowed start datetime (ISO). Internally normalized to the optimizer latest-start boundary.
      example: "2026-03-06T21:30:00+01:00"
      selector:
        text: {}
    latest_finish:
      required: false
      description: Expert override for absolute latest allowed finish datetime (ISO). Internally converted to a derived latest start.
      example: "2026-03-06T23:30:00+01:00"
      selector:
        text: {}

manage_plan:
  name: Manage plan
  description: Reset, delete, or re-optimize existing plan entities.
  target:
    entity:
      domain: sensor
  fields:
    mode:
      required: true
      description: Management mode. Use reset, delete, or reoptimize.
      example: "reset"
      selector:
        select:
          options:
            - "reset"
            - "delete"
            - "reoptimize"

manage_profile_run:
  name: Manage profile run
  description: Start, finish, or abort an active logger run.
  target:
    entity:
      domain: sensor
  fields:
    mode:
      required: true
      description: Management mode. Use start, finish, or abort.
      example: "start"
      selector:
        select:
          options:
            - "start"
            - "finish"
            - "abort"
    reason:
      required: false
      description: Abort reason stored with the logger runtime. Only used for mode=abort.
      example: "manual_abort"
      selector:
        select:
          options:
            - "manual_abort"
            - "program_mismatch"
            - "restart_recovery"
            - "sampling_delay_exceeded"
    program_key:
      required: false
      description: Program key for the selected run operation. Only used for mode=start, finish, abort.
      example: "auto_2"
      selector:
        text: {}
    program_display_name:
      required: false
      description: Human-readable program name to store for newly created or updated profiles. Only used for mode=start.
      example: "Auto 2 [I,D]"
      selector:
        text: {}

manage_profile:
  name: Manage profile
  description: Get, reset, or delete profiles, and manage estimated runtimes for one logger.
  target:
    entity:
      domain: sensor
  fields:
    mode:
      required: true
      description: Management mode. Use get, reset, delete, add_estimated_runtimes, list_estimated_runtimes, delete_estimated_runtime, or clear_estimated_runtimes.
      example: "get"
      selector:
        select:
          options:
            - "get"
            - "reset"
            - "delete"
            - "add_estimated_runtimes"
            - "list_estimated_runtimes"
            - "delete_estimated_runtime"
            - "clear_estimated_runtimes"
    program_key:
      required: false
      description: Program key used for one profile operation. Only used for mode=get, reset, delete, list_estimated_runtimes, delete_estimated_runtime.
      example: "auto_2"
      selector:
        text: {}
    desired_slot_minutes:
      required: false
      description: Optional resampled slot size. Must be an integer multiple or divisor of the stored slot length. Only used for mode=get.
      example: "15"
      selector:
        number:
          min: 1
          max: 120
          mode: box
    debug:
      required: false
      description: Include debug details in the exported profile payload where available. Only used for mode=get.
      example: "false"
      selector:
        boolean: {}
    items:
      required: false
      description: Mapping of program_key to duration_minutes. Only used for mode=add_estimated_runtimes.
      example: "{\"auto_2\": 180, \"auto_2_i_d_s\": 140}"
      selector:
        object: {}
